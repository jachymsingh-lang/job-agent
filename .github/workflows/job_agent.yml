name: Job Agent

on:
  schedule:
    - cron: "5 17 * * *"   # 19:05 v létě / 18:05 v zimě (v zimě se sám přeskočí)
    - cron: "5 18 * * *"   # 20:05 v létě / 19:05 v zimě
    - cron: "5 19 * * *"   # záloha, kdyby se některý běh zpozdil nebo vynechal
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python job_agent.py
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          ONLY_AT_HOUR: ${{ github.event_name == 'schedule' && '19' || '' }}

      - name: Uložit stav (seen.json, last_sent.txt)
        run: |
          git config user.name "job-agent[bot]"
          git config user.email "job-agent@users.noreply.github.com"
          for f in seen.json last_sent.txt; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "Beze změn."
          else
            git commit -m "Aktualizace stavu job agenta"
            git pull --rebase
            git push
          fi
