name: Job Agent

on:
  schedule:
    - cron: "5 17 * * *"   # 19:05 v létě (CEST)
    - cron: "5 18 * * *"   # 19:05 v zimě (CET)
  workflow_dispatch:

# Potřeba, aby workflow mohl uložit seen.json zpět do repozitáře.
permissions:
  contents: write

# Dva běhy najednou by si přepsaly seen.json.
concurrency:
  group: job-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python job_agent.py
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          ONLY_AT_HOUR: ${{ github.event_name == 'schedule' && '19' || '' }}

      - name: Uložit seznam odeslaných inzerátů
        run: |
          if [ -f seen.json ]; then
            git config user.name "job-agent[bot]"
            git config user.email "job-agent@users.noreply.github.com"
            git add seen.json
            if git diff --cached --quiet; then
              echo "seen.json beze změn."
            else
              git commit -m "Aktualizace seen.json"
              git pull --rebase
              git push
            fi
          else
            echo "seen.json zatím neexistuje (nebylo co poslat)."
          fi
